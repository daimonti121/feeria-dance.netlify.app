<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Облік відвідування</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: #090d16;
    }
    .iframe-container {
      width: 100%; height: 100%; position: relative;
    }
    /* Цей відступ ховає верхню плашку Google Apps Script */
    iframe {
      width: 100%; height: calc(100% + 50px); border: none; margin-top: -50px;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe src="https://script.google.com/macros/s/AKfycbwWrBzZMAoFzibcwF0BQCDAjJKmEahrYxmfM0wxm7oHqg5UKhRGauuBARklJgJJ_OEa/exec"></iframe>
  </div>
</body>
</html>
